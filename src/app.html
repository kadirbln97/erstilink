<style>
/* ============================================================
   DESIGN TOKENS
   ============================================================ */
:root{
  --ink:#12122b;
  --ink-2:#3d3d5c;
  --ink-3:#6c6c8a;
  --line:#e6e6f0;
  --line-2:#f0f0f7;
  --bg:#ffffff;
  --bg-soft:#f8f8fc;
  --brand:#4f46e5;
  --brand-dark:#3730a3;
  --brand-soft:#eef0ff;
  --wa:#25d366;
  --wa-dark:#128c4a;
  --danger:#dc2626;
  --radius:14px;
  --radius-sm:10px;
  --shadow-sm:0 1px 2px rgba(18,18,43,.06);
  --shadow:0 4px 20px rgba(18,18,43,.08);
  --shadow-lg:0 20px 60px rgba(18,18,43,.16);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  --maxw:1120px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);
  font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;
}
a{color:inherit}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 20px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hidden{display:none !important}

/* ============================================================
   HEADER
   ============================================================ */
.site-head{
  position:sticky;top:0;z-index:40;background:rgba(255,255,255,.88);
  backdrop-filter:saturate(180%) blur(14px);border-bottom:1px solid var(--line);
}
.site-head .wrap{display:flex;align-items:center;justify-content:space-between;height:62px;gap:16px}
.logo{display:inline-flex;align-items:center;gap:9px;font-weight:700;letter-spacing:-.02em;text-decoration:none;font-size:17px}
.logo-mark{
  width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--brand),#7c3aed);color:#fff;font-size:15px;
}
.head-actions{display:flex;align-items:center;gap:8px}

/* ============================================================
   BUTTONS
   ============================================================ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:10px 16px;border-radius:var(--radius-sm);border:1px solid transparent;
  font-size:14.5px;font-weight:600;cursor:pointer;text-decoration:none;
  transition:background .16s ease,border-color .16s ease,color .16s ease,transform .12s ease;
  white-space:nowrap;
}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--brand);color:#fff}
.btn-primary:hover{background:var(--brand-dark)}
.btn-ghost{background:transparent;color:var(--ink-2);border-color:var(--line)}
.btn-ghost:hover{background:var(--bg-soft);color:var(--ink)}
.btn-wa{background:var(--wa);color:#06301a}
.btn-wa:hover{background:#1fbb5a}
.btn-danger{background:#fff;color:var(--danger);border-color:#fbd5d5}
.btn-danger:hover{background:#fef2f2}
.btn-sm{padding:7px 12px;font-size:13px;border-radius:8px}

/* ============================================================
   HERO
   ============================================================ */
.hero{
  position:relative;overflow:hidden;color:#fff;
  background:radial-gradient(1000px 500px at 15% -10%,#6d5cf6 0%,transparent 60%),
             radial-gradient(800px 500px at 90% 0%,#a855f7 0%,transparent 55%),
             linear-gradient(160deg,#191840 0%,#0e0d24 100%);
}
.hero .wrap{padding-top:64px;padding-bottom:52px}
.badge{
  display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;
  padding:6px 13px;border-radius:999px;background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.18);color:#e5e2ff;letter-spacing:.01em;
}
.dot{width:6px;height:6px;border-radius:50%;background:var(--wa);box-shadow:0 0 0 3px rgba(37,211,102,.25)}
.hero .kicker{margin:16px 0 0;font-size:14.5px;font-weight:600;color:#a9a5d4;letter-spacing:-.005em}
.hero h1{
  margin:10px 0 0;font-size:clamp(30px,5.4vw,52px);line-height:1.08;
  letter-spacing:-.033em;font-weight:800;max-width:16ch;
}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,#7dffb0,#4ade80);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p.lead{margin:18px 0 0;max-width:60ch;color:#c6c3e8;font-size:clamp(15px,2vw,17.5px)}
.hero-steps{
  list-style:none;margin:26px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:10px 22px;counter-reset:step;
}
.hero-steps li{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:650;color:#e5e2ff}
.hero-steps span{
  display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);font-size:12px;font-weight:800;flex-shrink:0;
}
.hero-stats{display:flex;flex-wrap:wrap;gap:26px;margin-top:30px}
.stat b{display:block;font-size:22px;font-weight:800;letter-spacing:-.02em}
.stat span{font-size:12.5px;color:#a9a5d4;text-transform:uppercase;letter-spacing:.06em;font-weight:600}

/* ============================================================
   SEARCH
   ============================================================ */
.search-bar{position:relative;margin-top:32px;max-width:560px}
.search-bar svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);opacity:.45;pointer-events:none}
.search-bar input{
  width:100%;padding:15px 44px 15px 46px;border-radius:var(--radius);
  border:1px solid var(--line);background:#fff;color:var(--ink);
  font-size:16px;font-family:inherit;box-shadow:var(--shadow);
}
.search-bar input::placeholder{color:var(--ink-3)}
.search-bar input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px rgba(79,70,229,.15)}
.search-clear{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);
  border:0;background:transparent;cursor:pointer;padding:8px;color:var(--ink-3);
  font-size:18px;line-height:1;border-radius:8px;
}
.search-clear:hover{background:var(--bg-soft);color:var(--ink)}

/* ============================================================
   SECTIONS / TOOLBAR
   ============================================================ */
main{padding-bottom:70px}
.section-head{padding-top:44px;display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between}
.section-head h2{margin:0;font-size:24px;letter-spacing:-.025em;font-weight:750}
.section-head .sub{margin:4px 0 0;color:var(--ink-3);font-size:14.5px}
.filters{display:flex;gap:6px;background:var(--bg-soft);padding:4px;border-radius:11px;border:1px solid var(--line)}
.filter-select select{
  padding:10px 13px;border:1px solid var(--line);border-radius:var(--radius-sm);
  font-size:14px;font-family:inherit;background:#fff;color:var(--ink);font-weight:600;min-width:210px;
}
.filter-select select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(79,70,229,.13)}
.chip{
  border:0;background:transparent;padding:7px 13px;border-radius:8px;cursor:pointer;
  font-size:13.5px;font-weight:600;color:var(--ink-3);transition:all .15s ease;
}
.chip:hover{color:var(--ink)}
.chip[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:var(--shadow-sm)}

.alpha{display:flex;flex-wrap:wrap;gap:4px;margin-top:22px}
.alpha button{
  min-width:29px;height:29px;border-radius:7px;border:1px solid var(--line);
  background:#fff;color:var(--ink-2);font-size:12.5px;font-weight:650;cursor:pointer;
  transition:all .14s ease;
}
.alpha button:hover:not(:disabled){border-color:var(--brand);color:var(--brand)}
.alpha button:disabled{opacity:.28;cursor:default}
.alpha button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}

/* ============================================================
   UNI LIST
   ============================================================ */
.letter-group{margin-top:34px}
.letter-group > h3{
  margin:0 0 12px;font-size:12px;font-weight:800;letter-spacing:.14em;color:var(--ink-3);
  text-transform:uppercase;border-bottom:1px solid var(--line-2);padding-bottom:8px;
}
.uni-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:8px}
.uni-card{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:12px 14px;border:1px solid var(--line);border-radius:var(--radius-sm);
  background:#fff;text-decoration:none;transition:all .15s ease;
}
.uni-card:hover{border-color:#c7c4f5;background:var(--brand-soft);transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.uni-card .nm{font-size:14.5px;font-weight:600;letter-spacing:-.01em;line-height:1.35}
.uni-card .meta{display:flex;align-items:center;gap:7px;flex-shrink:0}
.count{
  font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;
  background:#e8fbf0;color:var(--wa-dark);
}
.count.zero{background:var(--bg-soft);color:var(--ink-3)}
.flag{font-size:14px;line-height:1}

.empty{
  text-align:center;padding:56px 20px;border:1px dashed var(--line);
  border-radius:var(--radius);background:var(--bg-soft);margin-top:30px;
}
.empty h3{margin:0 0 6px;font-size:18px;letter-spacing:-.02em}
.empty p{margin:0 0 18px;color:var(--ink-3);font-size:14.5px}

/* ============================================================
   CTA BANNER
   ============================================================ */
.cta{
  margin-top:52px;padding:30px;border-radius:18px;
  background:linear-gradient(135deg,#1c1b3f,#2b2660);color:#fff;
  display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:space-between;
}
.cta h3{margin:0 0 5px;font-size:20px;letter-spacing:-.025em}
.cta p{margin:0;color:#bdb9e6;font-size:14.5px;max-width:52ch}

/* ============================================================
   FAQ
   ============================================================ */
.faq{margin-top:52px}
.faq h2{margin:0 0 20px;font-size:24px;letter-spacing:-.025em;font-weight:750}
.faq-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:22px 28px}
.faq-item h3{margin:0 0 6px;font-size:15.5px;font-weight:700;letter-spacing:-.01em}
.faq-item p{margin:0;color:var(--ink-3);font-size:14.5px;line-height:1.55}

/* ============================================================
   DETAIL VIEW
   ============================================================ */
.crumb{
  display:inline-flex;align-items:center;gap:6px;margin-top:26px;
  font-size:14px;font-weight:600;color:var(--ink-3);text-decoration:none;
}
.crumb:hover{color:var(--brand)}
.detail-head{margin-top:14px;padding-bottom:22px;border-bottom:1px solid var(--line)}
.detail-head h1{margin:0;font-size:clamp(25px,4vw,36px);letter-spacing:-.032em;line-height:1.14;font-weight:800}
.detail-head .official{margin:8px 0 0;color:var(--ink-2);font-size:16px;font-weight:500;letter-spacing:-.01em}
.detail-head .sub{margin:7px 0 0;color:var(--ink-3);font-size:15px}
.detail-search{margin-top:22px;max-width:420px}

.group-list{list-style:none;margin:24px 0 0;padding:0;display:grid;gap:8px}
.group-item{
  display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between;
  padding:14px 16px;border:1px solid var(--line);border-radius:var(--radius-sm);background:#fff;
  transition:border-color .15s ease,box-shadow .15s ease;
}
.group-item:hover{border-color:#c9f0d9;box-shadow:var(--shadow-sm)}
.group-item .info{min-width:0}
.group-item .title{font-weight:650;font-size:15.5px;letter-spacing:-.012em}
.group-item .note{font-size:13px;color:var(--ink-3);margin-top:2px}

/* ============================================================
   MODAL
   ============================================================ */
.overlay{
  position:fixed;inset:0;background:rgba(12,12,30,.5);backdrop-filter:blur(3px);
  display:grid;place-items:center;padding:20px;z-index:80;
}
.modal{
  background:#fff;border-radius:18px;max-width:520px;width:100%;
  box-shadow:var(--shadow-lg);max-height:88vh;overflow:auto;
}
.modal-head{padding:22px 24px 0;display:flex;justify-content:space-between;gap:14px;align-items:flex-start}
.modal-head h2{margin:0;font-size:20px;letter-spacing:-.025em}
.modal-head p{margin:6px 0 0;font-size:14px;color:var(--ink-3)}
.modal-body{padding:20px 24px}
.modal-foot{padding:0 24px 22px;display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap}
.x{border:0;background:transparent;font-size:22px;line-height:1;cursor:pointer;color:var(--ink-3);padding:4px 8px;border-radius:8px}
.x:hover{background:var(--bg-soft);color:var(--ink)}

/* ============================================================
   FORM
   ============================================================ */
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:650;margin-bottom:6px;color:var(--ink-2)}
.field input,.field select,.field textarea{
  width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:var(--radius-sm);
  font-size:14.5px;font-family:inherit;background:#fff;color:var(--ink);
}
.field input:focus,.field select:focus,.field textarea:focus{
  outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(79,70,229,.13)
}
.field .hint{font-size:12.5px;color:var(--ink-3);margin-top:5px}
.field textarea{min-height:78px;resize:vertical}
.row-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* ============================================================
   ADMIN
   ============================================================ */
.admin-note{
  margin-top:20px;padding:13px 16px;border-radius:var(--radius-sm);
  background:#fff8e6;border:1px solid #f5e2ac;color:#7a5b06;font-size:13.5px;
}
.admin-bar{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.admin-panel{margin-top:22px;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.admin-panel > header{
  padding:13px 16px;background:var(--bg-soft);border-bottom:1px solid var(--line);
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
}
.admin-panel > header h3{margin:0;font-size:15px;letter-spacing:-.015em}
.admin-rows{max-height:520px;overflow:auto}
.admin-row{
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
  padding:11px 16px;border-bottom:1px solid var(--line-2);
}
.admin-row:last-child{border-bottom:0}
.admin-row .lbl{font-size:14px;font-weight:600;min-width:0}
.admin-row .sub{font-size:12.5px;color:var(--ink-3);word-break:break-all}
.admin-actions{display:flex;gap:6px;flex-shrink:0;align-items:center}
.admin-actions select{
  padding:6px 9px;border:1px solid var(--line);border-radius:8px;
  font-size:12.5px;font-family:inherit;background:#fff;color:var(--ink);
}
.status{
  display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;
  letter-spacing:.02em;text-transform:uppercase;
}
.tag{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--brand-soft);color:var(--brand-dark);letter-spacing:.02em;vertical-align:1px}
.status.offen{background:#f1f1f7;color:#6c6c8a}
.status.angeschrieben{background:#fff3d6;color:#8a6100}
.status.antwort{background:#e0edff;color:#1d4ed8}
.status.erledigt{background:#e8fbf0;color:var(--wa-dark)}

/* ============================================================
   FOOTER
   ============================================================ */
.site-foot{border-top:1px solid var(--line);background:var(--bg-soft);padding:30px 0}
.site-foot .wrap{display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:center;font-size:13.5px;color:var(--ink-3)}
.site-foot a{color:var(--ink-3);text-decoration:none;margin-left:16px}
.site-foot a:hover{color:var(--brand)}

.legal{max-width:760px;margin-top:30px}
.legal h1{font-size:28px;letter-spacing:-.03em;margin:0 0 6px}
.legal h2{font-size:17px;margin:26px 0 6px;letter-spacing:-.02em}
.legal p{color:var(--ink-2);font-size:15px}
.legal a{color:var(--brand);text-decoration:underline;text-underline-offset:2px}
.legal .lead-note{background:var(--brand-soft);border:1px solid #d7d5f7;border-radius:var(--radius-sm);
  padding:14px 16px;color:var(--ink);font-size:15px;margin:18px 0 4px}
.legal .stand{font-size:13.5px;color:var(--ink-3);margin-top:22px}
.legal h2:first-of-type{margin-top:22px}

/* ============================================================
   TOAST
   ============================================================ */
.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:11px 20px;border-radius:999px;
  font-size:14px;font-weight:600;z-index:120;box-shadow:var(--shadow-lg);
  animation:pop .22s cubic-bezier(.2,.9,.3,1.2);
}
@keyframes pop{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}

@media (max-width:640px){
  .hero .wrap{padding-top:44px;padding-bottom:38px}
  .section-head{align-items:flex-start;flex-direction:column}
  .uni-grid{grid-template-columns:1fr}
  .row-2{grid-template-columns:1fr}
  .cta{padding:22px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
}
</style>
</head>

function clone(o){ return JSON.parse(JSON.stringify(o)); }

function loadData(){
  const base = clone(SEED_UNIS).map(u => Object.assign({ status:"offen", groups:[] }, u));

  let saved = null;
  try{
    let raw = localStorage.getItem(CONFIG.storageKey);
    for(const k of (CONFIG.legacyKeys || [])){ if(!raw) raw = localStorage.getItem(k); }
    if(raw){
      const parsed = JSON.parse(raw);
      if(Array.isArray(parsed) && parsed.length) saved = parsed;
    }
  }catch(e){ console.warn("Gespeicherte Daten unlesbar, nutze Seed.", e); }

  if(!saved){ DATA = base; return; }

  // Seed als Grundlage, gespeicherte Gruppen und Status darüberlegen, eigene
  // Einträge anhängen. So tauchen neu ergänzte Hochschulen nach einem Update
  // auf, ohne dass bereits gepflegte Links verloren gehen.
  const byId = new Map(base.map(u => [u.id, u]));
  saved.forEach(s => {
    if(!s || !s.id) return;
    const t = byId.get(s.id);
    if(t){
      if(Array.isArray(s.groups) && s.groups.length) t.groups = s.groups;
      if(s.status) t.status = s.status;
    } else {
      byId.set(s.id, Object.assign({ status:"offen", groups:[], country:"DE", full:"", land:"", typ:"", traeger:"" }, s));
    }
  });
  DATA = Array.from(byId.values());
}
function saveData(){
  try{ localStorage.setItem(CONFIG.storageKey, JSON.stringify(DATA)); }
  catch(e){ toast("Speichern fehlgeschlagen (Speicher voll?)"); }
}

const FLAG = { DE:"🇩🇪", AT:"🇦🇹", CH:"🇨🇭" };
const COUNTRY_NAME = { DE:"Deutschland", AT:"Österreich", CH:"Schweiz" };

function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
// Deutsche Transliteration: ü -> ue, ß -> ss
function norm(s){
  return String(s || "").toLowerCase()
    .replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss")
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"");
}
// Reine Akzententfernung: ü -> u
function fold(s){
  return String(s || "").toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/ß/g,"ss");
}
// Sucht wortweise und in beiden Schreibweisen. Damit finden "berlin tu",
// "tu berlin" und "muenchen lmu" den richtigen Eintrag, obwohl im Namen
// Klammern stehen: "Berlin (TU)".
function matches(text, q){
  if(!q) return true;
  const hay = [norm(text), fold(text)];
  const tokens = String(q).trim().split(/\s+/).filter(Boolean);
  if(!tokens.length) return true;
  return tokens.every(tok => {
    const forms = [norm(tok), fold(tok)];
    return hay.some(a => forms.some(b => b && a.indexOf(b) !== -1));
  });
}
function slugify(s){
  return norm(s).replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") || ("uni-" + Date.now());
}
function uniqueId(base){
  let id = base, n = 2;
  while(DATA.some(u => u.id === id)){ id = base + "-" + (n++); }
  return id;
}
function firstLetter(name){
  const c = norm(name).charAt(0).toUpperCase();
  return /[A-Z]/.test(c) ? c : "#";
}
function safeUrl(u){
  const s = String(u || "").trim();
  return /^https?:\/\//i.test(s) ? s : null;
}
function totalGroups(){ return DATA.reduce((n,u) => n + (u.groups ? u.groups.length : 0), 0); }
function countries(){ return [...new Set(DATA.map(u => u.country).filter(Boolean))]; }
function laender(){ return [...new Set(DATA.map(u => u.land).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"de")); }

function copyText(text, okMsg){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(() => toast(okMsg))
      .catch(() => window.prompt("Zum Kopieren markieren:", text));
  } else {
    window.prompt("Zum Kopieren markieren:", text);
  }
}
function unisWithGroups(){ return DATA.filter(u => u.groups && u.groups.length).length; }

let toastTimer = null;
function toast(msg){
  document.querySelectorAll(".toast").forEach(n => n.remove());
  const el = document.createElement("div");
  el.className = "toast"; el.setAttribute("role","status"); el.textContent = msg;
  document.body.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.remove(), 2600);
}

/* ============================================================
   5. ROUTER  –  echte Pfade (/uni/aachen-rwth), damit Suchmaschinen
   jede Uni-Seite einzeln erfassen können. Beim Öffnen der Datei
   per Doppelklick (file://) läuft alles ohne Adressänderung weiter.
   ============================================================ */
const USE_PATHS = location.protocol === "http:" || location.protocol === "https:";
let filePath = "";   // Route, wenn die Seite lokal ohne Server läuft

function LINK(path){
  if(!USE_PATHS) return "#/" + path;
  return "/" + path;
}

function currentPath(){
  if(!USE_PATHS) return filePath;
  return location.pathname.replace(/^\/+|\/+$/g, "");
}

function go(path, replace){
  if(USE_PATHS){
    const url = "/" + path;
    if(replace) history.replaceState(null, "", url); else history.pushState(null, "", url);
  } else {
    filePath = path;
  }
  route();
}

function route(){
  // Alte Links mit #/… weiterleiten, damit geteilte Adressen weiter funktionieren
  if(USE_PATHS && location.hash.startsWith("#/")){
    const legacy = location.hash.replace(/^#\/?/, "");
    history.replaceState(null, "", "/" + legacy);
  }

  const parts = currentPath().split("/").filter(Boolean);
  try{ window.scrollTo(0,0); }catch(_){}

  if(parts[0] === "uni" && parts[1]) return renderDetail(decodeURIComponent(parts[1]));
  // Die Verwaltung existiert nur in der lokalen admin.html. Dort wird
  // window.ADMIN_UI gesetzt; online ist sie schlicht nicht vorhanden.
  if(parts[0] === "admin")           return window.ADMIN_UI ? window.ADMIN_UI() : renderNotFound();
  if(parts[0] === "impressum")       return renderLegal("impressum");
  if(parts[0] === "datenschutz")     return renderLegal("datenschutz");
  if(parts.length)                   return renderNotFound();
  return renderHome();
}

function renderNotFound(){
  document.title = "Seite nicht gefunden – " + CONFIG.siteName;
  document.getElementById("app").innerHTML = `
    <div class="wrap"><div class="empty" style="margin-top:60px">
      <h3>Diese Seite gibt es nicht</h3>
      <p>Vielleicht hat sich die Adresse geändert.</p>
      <a class="btn btn-primary" href="${LINK("")}">Zur Startseite</a>
    </div></div>`;
}

function filteredUnis(){
  const q = ui.q.trim();
  return DATA.filter(u => {
    if(ui.country !== "ALL" && u.country !== ui.country) return false;
    if(ui.land !== "ALL" && u.land !== ui.land) return false;
    if(ui.letter && firstLetter(u.name) !== ui.letter) return false;
    if(!q) return true;
    if(matches(u.name, q) || matches(u.full, q)) return true;
    return (u.groups || []).some(g => matches(g.name, q));
  }).sort((a,b) => a.name.localeCompare(b.name, "de"));
}

function setMeta(name, content){
  let el = document.querySelector('meta[name="' + name + '"]');
  if(!el){ el = document.createElement("meta"); el.setAttribute("name", name); document.head.appendChild(el); }
  el.setAttribute("content", content);
}
function setCanonical(url){
  let el = document.querySelector('link[rel="canonical"]');
  if(!el){ el = document.createElement("link"); el.rel = "canonical"; document.head.appendChild(el); }
  el.href = url;
}

          <label for="sName">Dein Name</label>
          <input id="sName" placeholder="optional">
        </div>
        <div class="field">
          <label for="sMail" id="sMailLabel">Deine E-Mail</label>
          <input id="sMail" type="email" placeholder="optional">
          <div class="hint" id="sMailHint">Nur für Rückfragen.</div>
        </div>
      </div>
      <div class="field">
        <label for="sNote">Anmerkung</label>
        <textarea id="sNote" placeholder="optional"></textarea>
      </div>
      <input type="hidden" id="sSem" value="${esc(CONFIG.semester)}">
    </form>
    <div class="modal-foot">
      <button class="btn btn-ghost" data-close>Abbrechen</button>
      <button class="btn btn-primary" type="submit" form="submitForm">E-Mail öffnen</button>
    </div>`);

  const root = document.getElementById("modalRoot");
  const el = id => document.getElementById(id);

  function applyMode(m){
    mode = m;
    root.querySelectorAll("[data-mode]").forEach(b =>
      b.setAttribute("aria-pressed", String(b.dataset.mode === m)));

    const isLink = m === "link";
    el("mTitle").textContent = isLink ? "Gruppe einreichen" : "Gruppe vermisst";
    el("mSub").textContent = isLink
      ? "Wir prüfen den Link und hinterlegen ihn bei deiner Uni."
      : "Sag uns, was fehlt – wir fragen bei der Fachschaft nach und melden uns, sobald es eine Gruppe gibt.";
    el("linkField").classList.toggle("hidden", !isLink);
    el("sLink").required = isLink;
    el("sMailLabel").textContent = isLink ? "Deine E-Mail" : "Deine E-Mail (empfohlen)";
    el("sMailHint").textContent = isLink
      ? "Nur für Rückfragen."
      : "Damit wir dir Bescheid geben können, sobald die Gruppe steht.";
  }

  root.querySelectorAll("[data-mode]").forEach(b =>
    b.addEventListener("click", () => applyMode(b.dataset.mode)));
  applyMode(mode);

  el("submitForm").addEventListener("submit", e => {
    e.preventDefault();
    const v = id => (el(id).value || "").trim();
    const isLink = mode === "link";

    const subject = (isLink ? "[LINK] " : "[BEDARF] ") + v("sUni") + " – " + v("sCourse");
    const body = [
      isLink ? "Neue Gruppe eingereicht" : "Gruppe wird vermisst",
      "",
      "Uni / Hochschule: " + v("sUni"),
      "Studiengang: " + v("sCourse"),
      isLink ? "Link: " + v("sLink") : "Link: – (noch keine Gruppe bekannt)",
      "Semester: " + v("sSem"),
      "Name: " + (v("sName") || "–"),
      "E-Mail: " + (v("sMail") || "–"),
      "",
      "Anmerkung:",
      v("sNote") || "–"
    ].join("\n");

    showMailStep(subject, body, isLink);
  });
}

/* Abschluss-Schritt: echter mailto-Link statt JS-Navigation.

}

/* SHA-256 ohne Abhängigkeiten. Web Crypto gäbe es zwar, steht aber nur
   in sicheren Kontexten bereit – beim lokalen Öffnen per file:// nicht.
   Diese Variante läuft überall. */
function sha256(msg){
  const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
           0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
           0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
           0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
           0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
           0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
           0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
           0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  let H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];

  const bytes=[...new TextEncoder().encode(msg)];
  const bitLen=bytes.length*8;
  bytes.push(0x80);
  while(bytes.length%64!==56) bytes.push(0);
  for(let i=7;i>=0;i--) bytes.push((bitLen/Math.pow(2,i*8))&0xff);

  const rotr=(x,n)=>(x>>>n)|(x<<(32-n));
  for(let i=0;i<bytes.length;i+=64){
    const w=new Array(64);
    for(let j=0;j<16;j++) w[j]=(bytes[i+j*4]<<24)|(bytes[i+j*4+1]<<16)|(bytes[i+j*4+2]<<8)|bytes[i+j*4+3];
    for(let j=16;j<64;j++){
      const s0=rotr(w[j-15],7)^rotr(w[j-15],18)^(w[j-15]>>>3);
      const s1=rotr(w[j-2],17)^rotr(w[j-2],19)^(w[j-2]>>>10);
      w[j]=(w[j-16]+s0+w[j-7]+s1)|0;
    }
    let [a,b,c,d,e,f,g,h2]=H;
    for(let j=0;j<64;j++){
      const S1=rotr(e,6)^rotr(e,11)^rotr(e,25);
      const ch=(e&f)^(~e&g);
      const t1=(h2+S1+ch+K[j]+w[j])|0;
      const S0=rotr(a,2)^rotr(a,13)^rotr(a,22);
      const maj=(a&b)^(a&c)^(b&c);
      const t2=(S0+maj)|0;
      h2=g; g=f; f=e; e=(d+t1)|0; d=c; c=b; b=a; a=(t1+t2)|0;
    }
    H=H.map((v,k)=>(v+[a,b,c,d,e,f,g,h2][k])|0);
  }
  return Promise.resolve(H.map(v=>(v>>>0).toString(16).padStart(8,"0")).join(""));
}

  document.getElementById("aSeed").addEventListener("click", () => {

  document.getElementById("aFile").addEventListener("change", e => {
    const f = e.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = () => {
      try{
        const p = JSON.parse(r.result);
        if(!Array.isArray(p) || !p.length || !p[0].id || !p[0].name) throw new Error("Falsches Format");
        DATA = p.map(u => ({ id:u.id, name:u.name, full:u.full || "", land:u.land || "",
          typ:u.typ || "", traeger:u.traeger || "", country:u.country || "DE",
          status: u.status || "offen", groups: Array.isArray(u.groups) ? u.groups : [] }));
        ui.adminUni = null; saveData(); renderAdmin(); toast("Import erfolgreich");
      }catch(err){ toast("Import fehlgeschlagen: " + err.message); }
    };
    r.readAsText(f);
    e.target.value = "";
  });
  document.getElementById("aReset").addEventListener("click", () => {
    if(!confirm("Alle lokalen Änderungen verwerfen und zum Auslieferungsstand zurückkehren?")) return;
    DATA = clone(SEED_UNIS); ui.adminUni = null; saveData(); renderAdmin(); toast("Zurückgesetzt");
  });
}

function groupForm(uniId, index){
  const uni = DATA.find(u => u.id === uniId); if(!uni) return;
  uni.groups = uni.groups || [];
  const g = index >= 0 ? uni.groups[index] : null;

  openModal(`
    <div class="modal-head">
      <div>
        <h2>${g ? "Gruppe bearbeiten" : "Gruppe hinzufügen"}</h2>
        <p>${esc(uni.name)}</p>
      </div>
      <button class="x" data-close aria-label="Schließen">×</button>
    </div>
    <form class="modal-body" id="grpForm">
      <div class="field">
        <label for="gName">Studiengang *</label>
        <input id="gName" required value="${esc(g ? g.name : "")}" placeholder="z. B. Maschinenbau B.Sc.">
      </div>
      <div class="field">
        <label for="gUrl">Einladungslink</label>
        <input id="gUrl" type="url" value="${esc(g ? g.url : "")}" placeholder="https://chat.whatsapp.com/…">
        <div class="hint">Leer lassen = „Link folgt“ wird angezeigt.</div>
      </div>
      <div class="field">
        <label for="gNote">Zusatz</label>
        <input id="gNote" value="${esc(g && g.note ? g.note : "")}" placeholder="z. B. nur Bachelor, Jahrgang 2026">
      </div>
    </form>
    <div class="modal-foot">
      <button class="btn btn-ghost" data-close>Abbrechen</button>
      <button class="btn btn-primary" type="submit" form="grpForm">Speichern</button>
    </div>`);

  document.getElementById("grpForm").addEventListener("submit", e => {
    e.preventDefault();
    const rec = {
      name: document.getElementById("gName").value.trim(),
      url:  document.getElementById("gUrl").value.trim(),
      note: document.getElementById("gNote").value.trim()
    };
    if(!rec.name) return;
    if(g) uni.groups[index] = rec; else uni.groups.push(rec);
    saveData(); closeModal(); renderAdmin(); toast("Gespeichert");
  });
}

let lastFocus = null;
function openModal(html){
  lastFocus = document.activeElement;
  const root = document.getElementById("modalRoot");
  root.innerHTML = `<div class="overlay" role="dialog" aria-modal="true"><div class="modal">${html}</div></div>`;
  root.querySelector(".overlay").addEventListener("mousedown", e => {
    if(e.target.classList.contains("overlay")) closeModal();
  });
  root.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", closeModal));
  const first = root.querySelector("input,select,textarea,button");
  if(first) first.focus();
  document.body.style.overflow = "hidden";
}
function closeModal(){
  document.getElementById("modalRoot").innerHTML = "";
  document.body.style.overflow = "";
  if(lastFocus && lastFocus.focus) lastFocus.focus();
}
document.addEventListener("keydown", e => { if(e.key === "Escape") closeModal(); });

document.addEventListener("click", e => {
  if(e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
  const a = e.target.closest("a");
  if(!a || a.target === "_blank" || a.hasAttribute("download")) return;

  const raw = a.getAttribute("href") || "";
  let path = null;
  if(raw.startsWith("#/"))                      path = raw.slice(2);
  else if(raw.startsWith("/") && !raw.startsWith("//")) path = raw.slice(1);
  if(path === null) return;

  e.preventDefault();
  go(path.replace(/\/+$/, ""));
});
